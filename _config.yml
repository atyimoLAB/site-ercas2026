title: ERCAS 2026
description: >-
  Escola Regional de Computação Aplicada à Saúde (ERCAS): evento que promove o uso de computação na saúde, incentivando troca de conhecimento e integração entre profissionais, pesquisadores, docentes, estudantes e instituições da área.
url: "https://ercas2026.ufba.br"
baseurl: ""

lang: pt-BR

theme: jekyll-theme-conference
plugins:
  - jekyll-feed
  - jekyll-include-cache

collections:
  talks:
    output: true
  speakers:
    output: true
    permalink: /palestrantes/:path/
  rooms:
    output: true
    permalink: /salas/:path/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room

include:
  - .htaccess

exclude:
  - en
  - GUIDE.md
  - README.md
  - docs
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - skills-lock.json
  - .claude

collections_dir: pt
data_dir: pt/_data

conference:
  lang: pt
  name: "ERCAS"
  year: "2026"
  tz: "-03:00"
  show_errors: true

  navigation:
    # Links da barra de navegação. Adicione `disabled: true` a um link para
    # ocultá-lo enquanto a seção correspondente não estiver pronta.
    links:
      - name: Sobre
        relative_url: /sobre/
      - name: Programação
        relative_url: /programacao/
      - name: Palestras
        relative_url: /palestras/
      - name: Palestrantes
        relative_url: /palestrantes/
      - name: Comitês
        relative_url: /comites/
        disabled: true
      - name: Patrocínio
        relative_url: /patrocinio/
      # Seção "Datas Importantes" oculta na edição 2026 — ver issue #42.
      # `disabled: true` NÃO oculta o link (o tema renderiza um link cinza inativo);
      # para reativar, descomente as 3 linhas abaixo e remova `published: false`
      # de pt/important-dates.md.
      # - name: Datas
      #   relative_url: /datas/
      #   disabled: true
      - name: Local
        relative_url: /local/
      - name: Inscrições
        absolute_url: "https://ercas2026.ufba.br/inscricoes"
        disabled: true

  event:
    dates: "6–7 de Outubro de 2026"
    city: "Salvador, BA"
    venue: "Instituto de Computação da Universidade Federal da Bahia (IC/UFBA)"
    registration_url: "https://ercas2026.ufba.br/inscricoes"

  social:
    email: "contato@ercas2026.ufba.br"
    instagram: "ercas2026"

  talks:
    tracks:
      - name: Processamento de Linguagem Natural e Saúde Mental
        color: info
      - name: Ciência de Dados Clínicos e Epidemiologia
        color: success
      - name: Fundamentos de IA e Aprendizado de Máquina
        color: danger
      - name: IoT, Sistemas e Infraestrutura em Saúde
        color: warning
      - name: Institucional
        color: secondary
    tags:
      - name: Keynote
        icon: star
      - name: Tutorial
        icon: mortarboard
      - name: Minicurso
      - name: Palestra
      # Sem `icon:` de propósito: get_tag_icon.html troca o TEXTO da tag pelo
      # ícone; um ícone tornaria estes badges só-ícone em /palestras/ e na
      # página da atividade, inconsistente com Minicurso/Palestra.
      - name: Credenciamento
      - name: Abertura
      - name: Fechamento
      - name: Workshop
